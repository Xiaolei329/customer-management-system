<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>客户信息编辑</title>
	<link href="https://www.layuicdn.com/layui-v2.5.6/css/layui.css" rel="stylesheet" />
	<script src="https://www.layuicdn.com/layui-v2.5.6/layui.js"></script>
</head>

<body>
	<div class="page-content-wrap" id="customAdd">
		<form class="layui-form" action="" id="">
			<div class="layui-form-item" id="customIdArea">
				<label class="layui-form-label">客户ID</label>
				<div class="layui-input-block">
					<input type="text" name="cust_id"  id="customId" lay-verify="customId"
						   readonly="readonly" hidden="hidden" >
				</div>
			</div>

			<div class="layui-form-item" >
				<label class="layui-form-label" >客户姓名</label>
				<div class="layui-input-block">
					<input type="text" name="cust_name"  id="customName" lay-verify="customName"
						placeholder="请输入客户姓名" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">客户来源</label>
				<input type="text" id="cust_source1" hidden="hidden"/>
				<div class="layui-input-block">
					<select name="cust_source" id="customSource" lay-verify="customSource"  lay-search="" class="layui-input">
						<option value="">请选择</option>
					</select>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">所属行业</label>
				<input type="text" id="cust_industry1" hidden="hidden"/>
				<div class="layui-input-block">
					<select name="cust_industry" id="customIndustry" lay-verify="customIndustry"  lay-search="" class="layui-input">
						<option value="">请选择</option>
					</select>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">客户级别</label>
				<input type="text" id="cust_level1" hidden="hidden"/>
				<div class="layui-input-block">
					<select name="cust_level" id="customLevel" lay-verify="customLevel"  lay-search="" class="layui-input">
						<option value="">请选择</option>
					</select>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">联系人</label>
				<div class="layui-input-block">
					<input type="text" name="cust_linkman"  id="custLinkman" lay-verify="custLinkman"
						   placeholder="请输入联系人" autocomplete="off" class="layui-input">
				</div>
			</div>

			<div class="layui-form-item">
				<label class="layui-form-label">固定电话</label>
				<div class="layui-input-block">
					<input type="text" name="cust_phone"  id="custPhone" lay-verify="custPhone"
						   placeholder="请输入固定电话" autocomplete="off" class="layui-input">
				</div>
			</div>

			<div class="layui-form-item">
				<label class="layui-form-label">移动电话</label>
				<div class="layui-input-block">
					<input type="text" name="cust_mobile"  id="custMobile" lay-verify="custMobile"
						   placeholder="请输入移动电话" autocomplete="off" class="layui-input">
				</div>
			</div>

			<div class="layui-form-item">
				<label class="layui-form-label">邮政编码</label>
				<div class="layui-input-block">
					<input type="text" name="cust_zipcode"  id="custZipcode" lay-verify="custZipcode"
						   placeholder="请输入邮政编码" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">联系地址</label>
				<div class="layui-input-block">
					<input type="text" name="cust_address"  id="custAddress" lay-verify="custAddress"
						   placeholder="请输入联系地址" autocomplete="off" class="layui-input">
				</div>
			</div>

			<div class="layui-form-item m-login-btn" style="text-align:center">
				<div class="layui-inline">
					<button class="layui-btn layui-btn-normal" lay-submit lay-filter="editCustom">保存修改</button>
				</div>
				<div class="layui-inline">
					<button type="reset" class="layui-btn layui-btn-primary  site-demo-active" id="reset">取消</button>
				</div>
			</div>
		</form>
		<hr></hr>
		<h5 style="text-align: center;">@客户信息管理系统</h5>
	</div>

	<script>
			layui.use(['form'], function(){
			  var form = layui.form;
			  var layer = layui.layer;
			  var $ = layui.jquery;
			  $("#customIdArea").hide();

				$.ajax({
					type: "POST",
					dataType: "json",
					url: "/NewSSMBOOT_war/dictionary/CustomSourceAndIndustryAndLevel",
					data: {},
					async: false,
					success: function (result) {
						if (result.code === 0) {
							console.log(result.data);
							var data = result.data;
							if(data.customSourceList.length > 0){
								for(i=0; i< data.customSourceList.length; i++){
									var temp = data.customSourceList[i];
									$("#customSource").append("<option  value='" + temp + "'>" + temp + "</option>");
								}
							}
							if(data.customIndustryList.length > 0){
								for(i=0; i< data.customIndustryList.length; i++){
									var temp = data.customIndustryList[i];
									$("#customIndustry").append("<option  value='" + temp + "'>" + temp + "</option>");
								}
							}
							if(data.customLevelList.length > 0){
								for(i=0; i< data.customLevelList.length; i++){
									var temp = data.customLevelList[i];
									$("#customLevel").append("<option  value='" + temp + "'>" + temp + "</option>");
								}
							}

                            var cust_source = $("#cust_source1").val();
							var cust_industry = $("#cust_industry1").val();
							var cust_level = $("#cust_level1").val();
							console.log(cust_source);
							console.log(cust_industry);
							console.log(cust_level);

							$("#customSource").val(cust_source);
							$("#customIndustry").val(cust_industry);
							$("#customLevel").val(cust_level);

							layui.form.render('select');
						}else{
							layer.msg('加载下拉框失败', {icon: 5});
						}
					}
				});

			  form.on('submit(editCustom)', function(data){
					var str = JSON.stringify(data.field)
					var param = JSON.parse(str);
					$.ajax({
							type: "POST",
							dataType: "json",
							url: "/NewSSMBOOT_war/custom/update",
							data: param,
							success: function (result) {
								if (result.code === 0) {
									var index = parent.layer.getFrameIndex(window.name);
									parent.layer.close(index);
									parent.layer.msg('编辑客户成功');
									parent.layui.table.reload('demoTable', {page:{curr:1}});
									}else{
										layer.msg('编辑客户失败', {
											icon: 5
										});
									}
							}
							});
					return false;
			  });
				$(document).on('click', '#reset', function(){
					var index = parent.layer.getFrameIndex(window.name);
					parent.layer.close(index);
					parent.layer.msg('已取消操作');
				});

			});
	</script>
</body>

</html>
